<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fighter Jet Vocabulary Typing Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0b10;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            user-select: none;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: #161622;
            border-bottom: 2px solid #ff3366;
            height: 60px;
            z-index: 5;
        }
        h1 {
            font-size: 20px;
            color: #ff3366;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 51, 102, 0.5);
        }
        #stats {
            display: flex;
            gap: 20px;
            font-size: 16px;
            font-weight: bold;
        }
        .stat-box {
            background: #222235;
            padding: 5px 15px;
            border-radius: 5px;
            border-bottom: 2px solid #ff3366;
        }
        #game-container {
            position: relative;
            flex: 1;
            width: 100%;
            background: radial-gradient(circle at center, #1a1a2e 0%, #0f0f1a 100%);
            overflow: hidden;
        }
        /* गिरते हुए शब्द स्टाइल */
        .word {
            position: absolute;
            font-size: 22px;
            font-weight: bold;
            color: #fff;
            background: rgba(34, 34, 53, 0.85);
            padding: 6px 14px;
            border-radius: 6px;
            white-space: nowrap;
            border: 1px solid #00adb5;
            box-shadow: 0 0 12px rgba(0, 173, 181, 0.4);
            transform: translateX(-50%);
            transition: border-color 0.2s;
        }
        /* फाइटर प्लेन */
        #fighter-plane {
            position: absolute;
            bottom: 30px;
            left: 50%;
            width: 60px;
            height: 60px;
            font-size: 50px;
            text-align: center;
            line-height: 60px;
            transform: translateX(-50%);
            transition: left 0.2s ease-out;
            filter: drop-shadow(0 0 10px #ff3366);
        }
        /* लेज़र बुलेट */
        .laser {
            position: absolute;
            width: 4px;
            height: 25px;
            background: #ff3366;
            box-shadow: 0 0 10px #ff3366, 0 0 20px #ff3366;
            border-radius: 2px;
        }
        /* धमाका (Explosion) */
        .explosion {
            position: absolute;
            width: 80px;
            height: 80px;
            font-size: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: translate(-50%, -50%);
            animation: explode 0.4s ease-out forwards;
            pointer-events: none;
        }
        @keyframes explode {
            0% { transform: translate(-50%, -50%) scale(0.3); opacity: 1; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
        }
        /* अदृश्य हिडन इनपुट - बैकग्राउंड टाइपिंग के लिए */
        #hidden-input {
            position: absolute;
            top: -100px;
            left: -100px;
            opacity: 0;
        }
        /* लाइव टाइपिंग प्रीव्यू टेक्स्ट */
        #typing-preview {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            font-weight: bold;
            color: #00adb5;
            letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(0, 173, 181, 0.6);
            background: rgba(0,0,0,0.4);
            padding: 4px 15px;
            border-radius: 4px;
            pointer-events: none;
        }
        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 15, 26, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        button {
            padding: 12px 30px;
            font-size: 18px;
            background-color: #ff3366;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(255, 51, 102, 0.4);
        }
        button:hover {
            background-color: #e02454;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <header>
        <h1>Fighter Mode 🚀</h1>
        <div id="stats">
            <div class="stat-box">SCORE: <span id="score">0</span></div>
            <div class="stat-box">LIVES: <span id="lives">3</span> ❤️</div>
        </div>
    </header>
    
    <div id="game-container">
        <!-- फाइटर प्लेन -->
        <div id="fighter-plane">🚀</div>
        
        <!-- टाइपिंग प्रीव्यू -->
        <div id="typing-preview"></div>

        <!-- गेम ओवर स्क्रीन -->
        <div id="game-over-screen">
            <h2 style="font-size: 42px; color: #ff3366; margin-bottom: 10px; text-transform: uppercase; text-shadow: 0 0 15px rgba(255,51,102,0.5);">Mission Failed!</h2>
            <p id="final-score" style="font-size: 22px; margin-bottom: 25px; color: #eee;">Your Score: 0</p>
            <button onclick="startGame()">Launch Mission</button>
        </div>
    </div>

    <!-- बैकग्राउंड इनपुट फ़ील्ड -->
    <input type="text" id="hidden-input" autocomplete="off" disabled>

    <script>

        let score = 0;
        let lives = 3;
        let fallingWords = [];

        let wordSpawnInterval;

        // ऑनलाइन API से रैंडम वर्ड फेच करना
        async function fetchOnlineWord() {
            try {
                const response = await fetch('https://herokuapp.com');
                if (!response.ok) throw new Error('API Error');
                const data = await response.json();
                return data[0]; 
            } catch (error) {
                // इंटरनेट फेल होने पर बैकअप वर्डलिस्ट से रैंडम वर्ड उठाएगा
                return backupWords[Math.floor(Math.random() * backupWords.length)];
            }
        }

        document.addEventListener('click', () => {
            if (gameRunning) hiddenInput.focus();
        });

        function startGame() {
            score = 0;
            lives = 3;
            fallSpeed = 1.0;

            lasers = [];
